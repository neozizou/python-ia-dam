<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" role="img" aria-label="Lectura por trozos con agregación incremental">
  <title>Lectura por trozos con agregación incremental</title>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="860" height="290" rx="14" fill="#ffffff" stroke="#c7cedb"/>
  <rect x="25" y="70" width="130" height="170" rx="10" fill="#f4f6fa" stroke="#c7cedb" stroke-width="1.5"/>
  <text x="90" y="100" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2430" text-anchor="middle" font-weight="700">fichero</text>
  <text x="90" y="122" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#5b6472" text-anchor="middle" font-weight="400">50 GB</text>
  <rect x="45" y="140" width="90" height="18" rx="3" fill="#dbe8fb" stroke="#2f6fd0" stroke-width="1"/>
  <rect x="45" y="164" width="90" height="18" rx="3" fill="#dbe8fb" stroke="#2f6fd0" stroke-width="1"/>
  <rect x="45" y="188" width="90" height="18" rx="3" fill="#dbe8fb" stroke="#2f6fd0" stroke-width="1"/>
  <rect x="45" y="212" width="90" height="18" rx="3" fill="#dbe8fb" stroke="#2f6fd0" stroke-width="1"/>
  <path d="M 160 155 L 210 155" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#punta)"/>
  <rect x="215" y="95" width="200" height="120" rx="10" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="232" y="125" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="700">trozo de 200.000</text>
  <text x="232" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">importe = unidades</text>
  <text x="232" y="170" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">          * precio</text>
  <text x="232" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">groupby + sum</text>
  <path d="M 420 155 L 470 155" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#punta)"/>
  <rect x="475" y="95" width="180" height="120" rx="10" fill="#d8f1e6" stroke="#1f9d6b" stroke-width="1.5"/>
  <text x="492" y="125" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="700">acumulado</text>
  <text x="492" y="155" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2430" text-anchor="start" font-weight="400">Granada</text>
  <text x="640" y="155" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2430" text-anchor="end" font-weight="400">3.059</text>
  <text x="492" y="180" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2430" text-anchor="start" font-weight="400">Málaga</text>
  <text x="640" y="180" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2430" text-anchor="end" font-weight="400">845</text>
  <text x="492" y="205" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2430" text-anchor="start" font-weight="400">...</text>
  <text x="640" y="205" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2430" text-anchor="end" font-weight="400"></text>
  <path d="M 560 230 Q 400 275 320 225" fill="none" stroke="#5b6472" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#punta)"/>
  <text x="360" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">y vuelta al siguiente trozo</text>
  <rect x="680" y="95" width="150" height="120" rx="10" fill="#ffffff" stroke="#d9822b" stroke-width="1.5"/>
  <text x="697" y="125" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="700">En memoria</text>
  <text x="697" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">solo 200.000 filas,</text>
  <text x="697" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">no el fichero entero.</text>
  <text x="697" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#d9822b" text-anchor="start" font-weight="400">Memoria constante.</text>
  <text x="25" y="48" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="700">pd.read_csv(..., chunksize=200_000)</text>
</svg>
