  <text x="30" y="285" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">Cada máquina hace su map; el reduce junta por clave. Es el groupby de la UD3, repartido.</text>
