  <text x="590" y="152" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f2430" text-anchor="start" font-weight="400">Málaga   →   9.130 €</text>
