  <rect x="280" y="258.0" width="170" height="40" rx="10" fill="#fbe9d4" stroke="#d9822b" stroke-width="1.5"/>
  <text x="365.0" y="282.3333333333333" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2430" text-anchor="middle" font-weight="500">Partición</text>
  <text x="250" y="180" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6472" text-anchor="middle" font-weight="700">elige 2</text>
  <rect x="470" y="60" width="270" height="95" rx="10" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="488" y="88" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="700">Relacional (ACID)</text>
  <text x="488" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">Prioriza coherencia.</text>
  <text x="488" y="134" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">Escala en vertical.</text>
  <rect x="470" y="175" width="270" height="95" rx="10" fill="#ffffff" stroke="#7b55c0" stroke-width="1.5"/>
  <text x="488" y="203" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="700">NoSQL distribuido</text>
  <text x="488" y="227" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">Prioriza disponibilidad:</text>
  <text x="488" y="249" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">coherencia eventual.</text>
  <text x="30" y="310" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">En un sistema repartido la red SIEMPRE puede partirse: la P no es opcional.</text>
