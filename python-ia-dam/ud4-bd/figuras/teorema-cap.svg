  <rect width="760" height="330" rx="14" fill="#ffffff" stroke="#c7cedb"/>
  <path d="M 250 60 L 140 258.0 L 360 258.0 Z" fill="#f4f6fa" stroke="#c7cedb" stroke-width="2"/>
  <rect x="155" y="32" width="190" height="40" rx="10" fill="#dbe8fb" stroke="#2f6fd0" stroke-width="1.5"/>
