<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Asignar no es copiar">
  <title>Asignar no es copiar</title>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="820" height="330" rx="14" fill="#ffffff" stroke="#c7cedb"/>
  <rect x="20" y="20" width="380" height="290" rx="10" fill="#f4f6fa" stroke="#c7cedb" stroke-width="1.5"/>
  <rect x="420" y="20" width="380" height="290" rx="10" fill="#f4f6fa" stroke="#c7cedb" stroke-width="1.5"/>
  <text x="40" y="48" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="700">b = a  →  alias</text>
  <text x="440" y="48" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2430" text-anchor="start" font-weight="700">c = a.copy()  →  copia</text>
  <rect x="50" y="75" width="70" height="34" rx="10" fill="#dbe8fb" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="85.0" y="96.66666666666667" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="500">a</text>
  <rect x="50" y="125" width="70" height="34" rx="10" fill="#dbe8fb" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="85.0" y="146.66666666666666" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="500">b</text>
  <rect x="220" y="80" width="150" height="75" rx="10" fill="#ffffff" stroke="#5b6472" stroke-width="1.5"/>
  <text x="295" y="112" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="700">[1, 2, 3, 4]</text>
  <text x="295" y="136" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">un solo objeto</text>
  <path d="M 125 92 L 215 100" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#punta)"/>
  <path d="M 125 142 L 215 135" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#punta)"/>
  <text x="50" y="195" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">b.append(4) también cambia a:</text>
  <text x="50" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">los dos nombres apuntan al mismo sitio.</text>
  <rect x="50" y="235" width="320" height="60" rx="10" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="64" y="258" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="400">matriz = [[0] * 3] * 2</text>
  <text x="64" y="280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="400">crea DOS referencias a la MISMA fila.</text>
  <rect x="450" y="75" width="70" height="34" rx="10" fill="#dbe8fb" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="485.0" y="96.66666666666667" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="500">a</text>
  <rect x="450" y="150" width="70" height="34" rx="10" fill="#d8f1e6" stroke="#1f9d6b" stroke-width="1.5"/>
  <text x="485.0" y="171.66666666666666" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="500">c</text>
  <rect x="620" y="70" width="150" height="50" rx="10" fill="#ffffff" stroke="#5b6472" stroke-width="1.5"/>
  <text x="695" y="100" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="400">[1, 2, 3, 4]</text>
  <rect x="620" y="145" width="150" height="50" rx="10" fill="#ffffff" stroke="#5b6472" stroke-width="1.5"/>
  <text x="695" y="175" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="400">[1, 2, 3, 4, 5]</text>
  <path d="M 525 90 L 615 93" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#punta)"/>
  <path d="M 525 165 L 615 168" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#punta)"/>
  <text x="450" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="400">Dos objetos independientes.</text>
  <rect x="450" y="245" width="320" height="50" rx="10" fill="#d8f1e6" stroke="#1f9d6b" stroke-width="1.5"/>
  <text x="464" y="275" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f9d6b" text-anchor="start" font-weight="400">matriz = [[0] * 3 for _ in range(2)]</text>
</svg>
