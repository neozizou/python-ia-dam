name: Publicar el sitio en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "tools/**"
      - ".github/workflows/publicar-sitio.yml"
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias del sitio
        run: pip install -r tools/requirements-sitio.txt

      - name: Preparar la carpeta docs/
        run: python tools/preparar_docs.py

      - name: Construir el sitio
        run: mkdocs build --strict

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
