site_name: Python aplicado a la Inteligencia Artificial
site_description: Materiales del módulo optativo de 2.º DAM · Curso 2026-2027
site_url: https://neozizou.github.io/python-ia-dam/
repo_url: https://github.com/neozizou/python-ia-dam
repo_name: neozizou/python-ia-dam
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: es
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: es

hooks:
  - tools/hooks_alertas.py

nav:
  - Inicio: index.md
  - UD1 · Python para quien ya programa: ud1.md
  - UD2 · Programación orientada a objetos: ud2.md
  - UD3 · Análisis de datos: ud3.md
  - UD4 · SQL y NoSQL: ud4.md
  - UD5 · Big Data: ud5.md
  - UD6 · Machine Learning: ud6.md
  - UD7 · Proyecto y despliegue: ud7.md
  - Material de apoyo:
      - Ficha del modelo: plantillas/ficha-modelo.md
      - Lista de comprobación del despliegue: plantillas/checklist-despliegue.md
      - Proyecto de ejemplo: proyecto-ejemplo.md

